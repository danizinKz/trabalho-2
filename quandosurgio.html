<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quem Criou</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: Arial, Helvetica, sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    background:#ececec;
}

.card{
    position:relative;
    width:380px;
    height:520px;
    overflow:hidden;
    border-radius:4px;
}

.card img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.topo{
    position:absolute;
    top:25px;
    left:50%;
    transform:translateX(-50%);
    color:#fff;
    font-size:14px;
    font-weight:400;
    z-index:2;
}

.overlay{
    position:absolute;
    inset:0;
    background:linear-gradient(
        to top,
        rgba(0,0,0,.80) 5%,
        rgba(0,0,0,.35) 35%,
        rgba(0,0,0,.05) 70%,
        rgba(0,0,0,.25) 100%
    );
}

.texto{
    position:absolute;
    bottom:35px;
    left:35px;
    right:35px;
    color:#fff;
    z-index:2;
}

.texto h2{
    font-size:29px;
    line-height:1.2;
    font-weight:400;
    margin-bottom:14px;
}

.texto p{
    font-size:18px;
    line-height:1.45;
    font-weight:300;
}
</style>

</head>
<body>

<div class="card">

    <img src="Rectangle 7.png" alt="Cinema">

    <div class="overlay"></div>

    <div class="topo">
        quem criou
    </div>

    <div class="texto">
        <h2>O primeiro filme do cinema exibido comercialmente para o público foi <strong>A Saída dos Operários da Fábrica</strong>.</h2>

        <p>
            (La Sortie de l'Usine Lumière à Lyon),
            rodado pelos irmãos Auguste e Louis Lumière
            em 1895.
        </p>
    </div>

</div>

</body>
</html>
